<style>
@font-face{font-family:"汇文明朝体";src:url("参考字体/Huiwen-mincho.ttf") format("truetype");font-style:normal;font-weight:400;font-display:swap}
:root{--bg:#f6f4ed;--paper:#fffefa;--ink:#332722;--muted:#857f76;--line:#eeeae1;--accent:#745c4e;--soft:#eae6dd;--shadow:0 9px 25px rgba(80,65,48,.07);--display:"汇文明朝体","Noto Serif SC","Songti SC","SimSun",serif;--ui:var(--display)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{max-width:520px;margin:auto;padding:24px 12px 102px;min-height:100vh}
.top{display:flex;justify-content:center;align-items:flex-start;text-align:center;position:relative;margin:12px 0 23px}

.zones{display:flex;gap:8px;overflow:auto;padding:2px 0 15px;scrollbar-width:none}

.calendar{background:var(--paper);border:1px solid var(--line);border-radius:27px;padding:16px 11px 13px;box-shadow:var(--shadow);transform-origin:50% 0;animation:calendar-open .58s cubic-bezier(.2,.85,.25,1) both}

.day.blank{background:transparent}

.day .stacks .emoji.second{position:absolute;left:38%;width:26px;font-size:21px;transform:rotate(9deg)}
.more{position:absolute;right:-1px;bottom:-4px;font-size:9px;color:var(--accent);background:var(--paper);border-radius:5px;padding:0 2px}
.day-empty{font-size:10px;color:#d0c8bf;margin-top:7px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:17px;margin-top:14px;box-shadow:var(--shadow)}

.empty .icon{display:block;font-size:36px;margin-bottom:6px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,253,249,.97);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;height:72px;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{width:19%;border:0;background:none;color:#918a82;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}
.tab b{font-weight:400;font-size:20px;line-height:23px}
.tab.on{color:var(--accent)}
.plus{width:54px;height:54px;border-radius:50%;border:0;background:#2e2b27;color:#fff;font-size:31px;box-shadow:0 5px 15px #aa9e90;transform:translateY(-12px)}
.section-title{font-size:22px;margin:1px 0 16px}
.sticker-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sticker-grid .sticker-card{min-width:0;max-width:none}
.weekly{margin-top:14px}
.weekly .monthnav strong{font-size:15px;white-space:nowrap}
.weekly .day{height:78px}
.weekly .stacks{height:47px}
.weekly .mini{width:41px;height:41px}
.weekly .mini,.weekly .emoji{animation:sticker-bloom 1s cubic-bezier(.16,.83,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 90ms)}
.favorites-page .sticker-card{opacity:0}
.favorite-day .sticker-card.reveal,.favorite-grid .sticker-card.reveal{animation:sticker-bloom 1s cubic-bezier(.16,.83,.2,1) both;animation-delay:calc(var(--i,0)*75ms + 70ms)}
.review-cover{background:var(--paper);border:1px solid var(--line);border-radius:27px;padding:22px 18px 26px;box-shadow:var(--shadow);overflow:hidden}
.review-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.review-year{color:#b4aaa0;font-size:17px;letter-spacing:.08em}
.review-range{color:#e7a828;font-size:30px;line-height:1.2;letter-spacing:.025em;font-weight:600;margin-top:5px}
.review-nav{display:flex;align-items:center;gap:1px}.review-nav button{font-size:25px}.review-nav button:disabled{opacity:.28;cursor:default}
.review-counts{margin:28px 0 10px;font-size:16px;color:#8f8479}.review-counts div{margin:7px 0}.review-counts strong{font-size:25px;color:var(--ink);font-weight:600;padding:0 5px}
.review-collage{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px 3px;align-items:end;margin:19px 0 10px;min-height:170px}
.review-piece{grid-column:span 3;border:0;background:transparent;min-width:0;padding:2px;display:flex;flex-direction:column;align-items:center;gap:3px;transform:rotate(var(--turn,0deg));animation:sticker-bloom .85s cubic-bezier(.16,.83,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.review-piece:nth-child(4n+2),.review-piece:nth-child(4n+3){grid-column:span 2}.review-piece:nth-child(4n+4){grid-column:span 4}

.review-piece .emoji{font-size:74px;height:120px;display:grid;place-items:center}.review-piece small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--muted)}

.settings-section{font-family:var(--display);font-size:19px;font-weight:400;margin:24px 2px 11px}

.profile-card strong{display:block;font-size:18px}.profile-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px;word-break:break-all}
.account-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.metric-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:15px}
.metric span{font-size:11px;color:var(--muted)}
.metric strong{display:block;font-size:25px;margin-top:4px}
.stats-panel{margin-top:12px}
.year-panel{min-height:460px}
.stats-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.stats-head strong{font-family:var(--display);font-size:16px;font-weight:400}
.stats-head .monthnav{padding:0;min-width:116px}
.stats-head .monthnav strong{font-size:12px;white-space:nowrap}
.stats-head .arrow{width:25px;height:28px;font-size:19px}
.stats-sub{font-size:11px;color:var(--muted)}
.stats-big{font-size:24px;font-weight:700;line-height:1.1}
.year-months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 5px;margin-top:17px}
.year-month{min-width:0}
.year-month-label{display:block;font-size:10px;color:var(--muted);margin:0 0 5px 2px}
.year-heatmap{display:grid;grid-template-columns:repeat(7,10px);grid-auto-rows:10px;gap:2px;width:max-content}
.year-dot{width:10px;height:10px;border:0;border-radius:2px;padding:0;background:#e9f3ef;cursor:pointer}
.year-empty{width:10px;height:10px}
.month-layout{display:flex;align-items:center;justify-content:space-between;gap:10px}
.month-summary{display:grid;gap:4px;flex:1}
.month-heatmap{display:grid;grid-template-columns:repeat(7,11px);grid-auto-rows:11px;gap:3px;flex:none}
.month-dot{width:11px;height:11px;border:0;border-radius:50%;padding:0;background:#e9f3ef;cursor:pointer}
.month-dot.on{outline:1px solid #286d58;outline-offset:1px}
.heat-empty{width:11px;height:11px}
.week-heatmap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week-heatmap button{min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;color:var(--ink);padding:0;cursor:pointer}
.week-heatmap small{font-size:10px;color:var(--muted)}
.week-heatmap b{width:100%;max-width:34px;min-height:27px;border-radius:8px;display:grid;place-items:center;background:#e9f3ef;font-size:10px;font-weight:500}
.week-heatmap button.on b{outline:1px solid #286d58;outline-offset:2px}
.year-dot[data-level="1"],.month-dot[data-level="1"],.week-heatmap [data-level="1"] b{background:#d4efe4}
.year-dot[data-level="2"],.month-dot[data-level="2"],.week-heatmap [data-level="2"] b{background:#a9dfc9}
.year-dot[data-level="3"],.month-dot[data-level="3"],.week-heatmap [data-level="3"] b{background:#74cda9}
.year-dot[data-level="4"],.month-dot[data-level="4"],.week-heatmap [data-level="4"] b{background:#39a979;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(34,29,23,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94vh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet-header{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;flex:none}
.sheet-header strong{font-size:18px}
.close{border:0;background:var(--paper);border-radius:50%;width:34px;height:34px;font-size:18px}
.sheet-body{padding:5px 18px 22px;overflow:auto;flex:1}
.sheet-foot{padding:10px 18px 15px;flex:none;background:var(--bg);border-top:1px solid var(--line)}
label{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px}
.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--paper);outline:none;color:var(--ink)}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:84px;resize:vertical}
.preview{display:grid;place-items:center;min-height:210px;background:#eee8dc;border-radius:18px;overflow:hidden;margin:8px 0 15px}
.preview img{max-width:90%;max-height:205px;object-fit:contain;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 4px 4px #8b8176)}
.preview.source img{max-height:260px;filter:none}
.lasso-canvas{display:block;width:100%;height:auto;margin:10px auto;border-radius:16px;touch-action:none;background:#eee8dc}
.lasso-tools{display:flex;align-items:center;gap:8px;margin:8px 0}.lasso-tools button{min-width:42px}.lasso-tools .lasso-space{flex:1}.lasso-result{width:min(100%,300px);height:240px;object-fit:contain;display:block;margin:16px auto;background:#eee8dc;border-radius:18px}.lasso-actions{display:flex;gap:10px}.lasso-actions button{flex:1;min-width:0;padding:10px 8px;font-size:13px;line-height:1.3;white-space:normal}.lasso-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}.lasso-compare .lasso-result{width:100%;height:180px;margin:12px auto 5px}.lasso-compare span{font-size:12px;color:var(--muted)}
.detail-actions{display:flex;gap:9px;margin:12px 0 18px}.detail-actions button{flex:1}
.border-line,.color-choices,.border-modes{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:8px 0}
.border-line input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.border-line output{min-width:32px;text-align:right;color:var(--accent)}
.border-mode{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;color:var(--muted)}
.border-mode.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.color-choice{width:31px;height:31px;border:2px solid #ddd7cb;border-radius:50%;background:var(--swatch);padding:0}
.color-choice.on{outline:2px solid var(--accent);outline-offset:2px}
.outline-color-custom{width:35px;height:35px;padding:2px;border:1px solid var(--line);border-radius:50%;background:var(--paper)}
.tag-row{display:flex;gap:7px;align-items:center}.tag-row .input{min-width:0;flex:1}.tag-row .secondary{flex:none}
.tag-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag-pill{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:5px 9px;color:var(--ink)}
.note-head{margin-top:16px}.note-head label{margin:0}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--paper);padding:7px 11px;border-radius:999px;color:var(--muted)}
.emoji-choice{width:42px;height:42px;display:grid;place-items:center;padding:0;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:20px;line-height:1}
.private-toggle{display:flex;align-items:center;gap:10px;margin-top:19px;color:var(--ink)}
.private-toggle input{width:18px;height:18px;accent-color:var(--accent)}
.choice.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.ai-status{text-align:center;padding:18px;color:var(--muted)}
.spinner{width:29px;height:29px;border:3px solid #d7cfc4;border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes calendar-open{0%{opacity:.2;transform:scaleY(.75) translateY(-15px)}72%{opacity:1;transform:scaleY(1.025) translateY(3px)}100%{opacity:1;transform:scaleY(1) translateY(0)}}
@keyframes sticker-drop{0%{opacity:0;translate:0 -55px;scale:.76;rotate:-13deg}60%{opacity:1;translate:0 7px;scale:1.1;rotate:5deg}77%{translate:0 -4px;scale:.97;rotate:-3deg}89%{translate:1px 2px;scale:1.02;rotate:2deg}100%{opacity:1;translate:0 0;scale:1;rotate:0}}

@media(prefers-reduced-motion:reduce){.calendar,.calendar .mini,.calendar .emoji,.weekly .mini,.weekly .emoji,.favorites-page .sticker-card,.review-piece{animation:none!important;opacity:1!important}}

.toast.on{display:block}
